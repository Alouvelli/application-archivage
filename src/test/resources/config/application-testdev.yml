# ===================================================================
# Spring Boot configuration for the "testdev" profile.
#
# This configuration is used for unit/integration tests with testcontainers database containers.
#
# To activate this configuration launch integration tests with the 'testcontainers' profile
#
# More information on database containers: https://www.testcontainers.org/modules/databases/
# ===================================================================

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # Utilisation de Testcontainers pour MySQL.
    # L'URL, le nom d'utilisateur et le mot de passe seront remplacés dynamiquement
    # par Testcontainers lui-même grâce au préfixe 'jdbc:tc:'.
    url: jdbc:tc:mysql:8.0.33:///newArchiveApp?TC_INITSCRIPT=file:src/main/resources/config/liquibase/master.xml
    username: archivage # Nom d'utilisateur par défaut pour le conteneur MySQL de test
    password: passer    # Mot de passe par défaut pour le conteneur MySQL de test
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      poolName: HikariTest
      auto-commit: false
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
#      hibernate.dialect: org.hibernate.dialect.MySQLDialect # Dialecte Hibernate pour MySQL
    hibernate:
      ddl-auto: create-drop # Liquibase gérera le schéma
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
  liquibase:
    contexts: test,testdev # Exécute Liquibase avec le contexte "test" et "testdev"
    change-log: classpath:config/liquibase/master.xml # Chemin vers votre master changelog
  mail:
    host: smtp.gmail.com
    port: 587
    username: abdalahtims@gmail.com
    password: otsduwzjlhflebio
    protocol: smtp
    tls: true
    properties.mail.smtp:
      auth: true
      starttls.enable: true
      ssl.trust: smtp.gmail.com
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  clientApp:
    name: 'newArchiveApp'
  async:
    core-pool-size: 2
    max-pool-size: 50
    queue-capacity: 10000
  mail:
    from: newArchiveApp@localhost
  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    authentication:
      jwt:
        base64-secret: dm90cmUtc3VwZXItY2hhbmdlZHNlY3JldGZvcmxpcXVpYmFzZXRlc3RzZWNyZXRmb3JsaXF1aWJhc2V0ZXN0c2VjcmV0Zm9ybGlxdWliYXNldGVzdHNlY3JldGZvcmxpcXVpYmFzZXRlc3RzZWNyZXRmb3JsaXF1aWJhc2V0ZXN0c2VjcmV0Zm9y
        # This token is for authentication in our tests, it should not expire
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  metrics:
    logs:
      enabled: true
      report-frequency: 60 # in seconds
