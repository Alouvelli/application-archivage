jhipster:
  async:
    core-pool-size: 1
    max-pool-size: 50
    queue-capacity: 10000
  # To test logstash appender
  logging:
    logstash:
      enabled: true
      host: localhost
      port: 5000
      # La propriété 'queue-size' peut ne plus être directement mappée dans les versions récentes de JHipster.
      # Si elle cause des erreurs de liaison, il est préférable de la commenter ou de la supprimer.
      # queue-size: 512 # Commenté car elle peut causer des erreurs de liaison
  mail:
    from: test@localhost
    base-url: http://127.0.0.1:8080
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
