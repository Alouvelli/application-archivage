# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================


spring:
  application:
    name: newArchiveApp
  cache:
    type: simple # Utilise un cache simple en mémoire pour les tests
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:h2:mem:newArchiveApp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE # Base de données H2 en mémoire
    name:
    username: sa
    password:
    hikari:
      auto-commit: false
  jpa:
#    database-platform: tech.jhipster.domain.util.FixedH2Dialect # Dialecte spécifique pour H2
    database: H2
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create-drop # Ne pas créer/mettre à jour automatiquement le schéma en test, Liquibase le fera
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
      # Ces propriétés sont souvent liées à des problèmes de cache de second niveau ou de statistiques
      # Si vous ne les utilisez pas explicitement, il est préférable de les désactiver pour les tests.
      # hibernate.cache.use_second_level_cache: false # Pas de cache de second niveau pour les tests
      # hibernate.cache.use_query_cache: false
      # hibernate.generate_statistics: false # Pas de statistiques pour les tests
  liquibase:
    change-log: classpath:config/liquibase/master.xml
    contexts: test # Contexte Liquibase pour les tests
    drop-first: false
  mail:
    host: localhost
    port: 587
    username: abdalahtims@gmail.com
    password: otsduwzjlhflebio
    protocol: smtp
    tls: true
    properties.mail.smtp:
      auth: true
      starttls.enable: true
      ssl.trust: smtp.gmail.com
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false # Désactive le cache Thymeleaf pour les tests

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
