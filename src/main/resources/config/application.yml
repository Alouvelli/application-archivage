# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

spring:
    application:
        name: gestionEcole
    profiles:
        active: prod # Le profil 'dev' sera activé par défaut si non spécifié
    messages:
        basename: i18n/messages
        encoding: UTF-8

    jpa:
        open-in-view: false
        properties:
            hibernate.jdbc.time_zone: UTC
        hibernate:
            ddl-auto: update # En production, ne pas créer/mettre à jour automatiquement le schéma
            naming:
                physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
                implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
server:
    port: 8082 # Port par défaut de l'application Spring Boot

springdoc:
    swagger-ui:
        path: /swagger-ui.html
    api-docs:
        path: /v3/api-docs

management:
    endpoints:
        web:
            base-path: /management
            exposure:
                include:
                    - configprops
                    - env
                    - health
                    - info
                    - logfile
                    - loggers
                    - prometheus
                    - threaddump
                    - liquibase
    endpoint:
        health:
            show-details: when_authorized
            roles: 'ROLE_ADMIN'
    info:
        git:
            mode: full
    prometheus:
        metrics:
            export:
                enabled: true
                step: 60

info:
    display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
    clientApp:
        name: 'gestionEcole'
    async:
        core-pool-size: 2
        max-pool-size: 50
        queue-capacity: 10000
    mail:
        from: gestionEcole@localhost
        base-url: http://localhost:9000 # Modify
    logging:
        use-json-format: false
        logstash:
            enabled: false
            host: localhost
            port: 5000
            ring-buffer-size: 512
            # queue-size: 512 # Commenté car potentiellement non lié
    security:
        authentication:
            jwt:
                # Ceci est la clé secrète Base64 encodée pour JWT.
                # Elle DOIT être présente et non vide.
                # Exemple (générez la vôtre avec 'echo "votre-super-cle-secrete-qui-doit-etre-longue-au-moins-32-caracteres" | base64'):
                base64-secret: cAaUPhhe65KE6D6rIp8IvdznwDi7Sejvbq242hXfk+XnfCnY4oDxCa+ReoGvCPglsaff/m3gVGf4IKZmkm4iQQ== # <--- TRÈS IMPORTANT : REMPLACEZ CECI PAR UNE CLÉ UNIQUE ET FORTE !
                token-validity-in-seconds: 86400
                token-validity-in-seconds-for-remember-me: 2592000
#  metrics:
#    logs: # Reports metrics in the logs
#      enabled: false # Commenté car potentiellement non lié
#      report-frequency: 60 # in seconds # Commenté car potentiellement non lié

