# ===================================================================
# Spring Boot configuration for the "prod" profile.
# ===================================================================

logging:
    level:
        ROOT: INFO
        org.yescola.gestion: INFO
        tech.jhipster: INFO

spring:
    devtools:
        restart:
            enabled: false
        livereload:
            enabled: false
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        url: jdbc:mysql://localhost:3306/archivageEcole?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=UTC # <--- URL MySQL (ajustez l'hôte si besoin, ex: 'mysql' si sur le même réseau Docker)
        username: archivage # <--- TRÈS IMPORTANT : Remplacez par votre nom d'utilisateur MySQL local
        password: passer # <--- TRÈS IMPORTANT : Remplacez par votre mot de passe MySQL local
        hikari:
            poolName: Hikari
            auto-commit: false
            data-source-properties:
                cachePrepStmts: true
                prepStmtCacheSize: 250
                prepStmtCacheSqlLimit: 2048
                useServerPrepStmts: true
        driver-class-name: com.mysql.cj.jdbc.Driver # <--- Driver JDBC MySQL
    jpa:
        database-platform: org.hibernate.dialect.MySQL8Dialect # <--- Dialecte Hibernate pour MySQL 8+
        database: mysql # <--- Base de données MySQL
        show-sql: false
        properties:
            hibernate.id.new_generator_mappings: true
            hibernate.connection.provider_disables_autocommit: true
            hibernate.cache.use_second_level_cache: false
            hibernate.cache.use_query_cache: false
            hibernate.generate_statistics: false
    liquibase:
        change-log: classpath:config/liquibase/master.xml
        contexts: prod
        drop-first: false
    jackson:
        afterburner:
            enabled: false
    mail:
        host: smtp.gmail.com
        port: 587
        username: abdalahtims@gmail.com
        password: fgrv qcmc xcps ddjg
        properties:
            mail.smtp.auth: true
            mail.smtp.starttls.enable: true
            mail.smtp.ssl.trust: "*"
            mail.smtp.timeout: 10000
            mail.smtp.connectiontimeout: 10000

server:
    port: 8082

