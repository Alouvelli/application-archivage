        base-url: ${FRONTEND_URL:http://192.168.0.155:9000}
    logging:
        use-json-format: false
        logstash:
            enabled: false
            host: localhost
            port: 5000
            ring-buffer-size: 512
    security:
        authentication:
            jwt:
                base64-secret: N2JmOWZjYzFmYWE2ZGY5NDYzYTExNTBlYWQ4ZTBkNmJkZTc1NDBmYzFjOTcxMDAxZjBjNGQxZjBkM2NjODdiZTdhOGQxOTZkYmVkNmEwNjY5ZGZiOGEzNzQ0MDFlYTkzYmI2YTAyMmU1OWI3ZjRlN2M1ZjY1ZjQ1ZWU3NDY1MWY= # Une clé de production
