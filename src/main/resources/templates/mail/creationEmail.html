<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{email.creation.title}">JHipster account creation</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<p th:text="#{email.activation.greeting(${user.login})}">
  Dear
</p>

<p th:text="#{email.creation.text1}">
  Your account has been created, please click the link below:
</p>

<p th:with="url=(@{|${baseUrl}/account/reset/finish?key=${user.resetKey}|})">
  <a th:href="${url}" th:text="${url}">
    Activate my account
  </a>
</p>

<p>
  <span th:text="#{email.activation.text2}">Regards, </span><br/>
  <em th:text="#{email.signature}">JHipster.</em>
</p>
</body>
</html>
