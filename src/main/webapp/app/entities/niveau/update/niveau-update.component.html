<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-niveau-heading" data-cy="NiveauCreateUpdateHeading" jhiTranslate="gestionEcoleApp.niveau.home.createOrEditLabel">
        Créer ou éditer un Niveau
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="gestionEcoleApp.niveau.id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_libelle" jhiTranslate="gestionEcoleApp.niveau.libelle">Libelle</label>
          <input type="text" class="form-control" name="libelle" id="field_libelle" data-cy="libelle" formControlName="libelle" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_description" jhiTranslate="gestionEcoleApp.niveau.description">Description</label>
          <input
            type="text"
            class="form-control"
            name="description"
            id="field_description"
            data-cy="description"
            formControlName="description"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_etat" jhiTranslate="gestionEcoleApp.niveau.etat">Etat</label>
          <input type="checkbox" class="form-check" name="etat" id="field_etat" data-cy="etat" formControlName="etat" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_encours" jhiTranslate="gestionEcoleApp.niveau.encours">Encours</label>
          <input type="checkbox" class="form-check" name="encours" id="field_encours" data-cy="encours" formControlName="encours" />
        </div>

        <div class="mb-3">
          <label for="field_typeDocuments" jhiTranslate="gestionEcoleApp.niveau.typeDocument">Type Document</label>
          <select
            class="form-control"
            id="field_typeDocuments"
            data-cy="typeDocument"
            multiple
            name="typeDocuments"
            formControlName="typeDocuments"
            [compareWith]="compareTypeDocument"
          >
            @for (typeDocumentOption of typeDocumentsSharedCollection; track $index) {
              <option [ngValue]="typeDocumentOption">{{ typeDocumentOption.id }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
