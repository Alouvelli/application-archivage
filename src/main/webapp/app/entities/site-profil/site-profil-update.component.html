<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-site-profil-heading" jhiTranslate="gestionEcoleApp.siteProfil.home.createOrEditLabel">Create or edit a Site Profil</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!siteProfil.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="siteProfil.id" readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.siteProfil.encours" for="field_encours">Encours</label>
                    <input type="checkbox" class="form-control" name="encours" id="field_encours"
                        [(ngModel)]="siteProfil.encours" />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.siteProfil.site" for="field_site">Site</label>
                    <select class="form-control" id="field_site" name="site" [(ngModel)]="siteProfil.site" >
                        <option [ngValue]="null"></option>
                        <option [ngValue]="siteOption.id === siteProfil.site?.id ? siteProfil.site : siteOption" *ngFor="let siteOption of sites; trackBy: trackSiteById">{{siteOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.siteProfil.profil" for="field_profil">Profil</label>
                    <select class="form-control" id="field_profil" name="profil" [(ngModel)]="siteProfil.profil" >
                        <option [ngValue]="null"></option>
                        <option [ngValue]="profilOption.id === siteProfil.profil?.id ? siteProfil.profil : profilOption" *ngFor="let profilOption of profils; trackBy: trackProfilById">{{profilOption.id}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
