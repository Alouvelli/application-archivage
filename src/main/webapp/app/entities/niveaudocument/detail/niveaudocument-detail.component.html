<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (niveaudocument(); as niveaudocumentRef) {
      <div>
        <h2 data-cy="niveaudocumentDetailsHeading">
          <span jhiTranslate="gestionEcoleApp.niveaudocument.detail.title">Niveaudocument</span>
        </h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ niveaudocumentRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="gestionEcoleApp.niveaudocument.etat">Etat</span></dt>
          <dd>
            <span>{{ niveaudocumentRef.etat }}</span>
          </dd>
          <dt><span jhiTranslate="gestionEcoleApp.niveaudocument.niveau">Niveau</span></dt>
          <dd>
            @if (niveaudocument()!.niveau) {
              <div>
                <a [routerLink]="['/niveau', niveaudocument()!.niveau?.id, 'view']">{{ niveaudocumentRef.niveau?.id }}</a>
              </div>
            }
          </dd>
          <dt><span jhiTranslate="gestionEcoleApp.niveaudocument.document">Document</span></dt>
          <dd>
            @if (niveaudocument()!.document) {
              <div>
                <a [routerLink]="['/document', niveaudocument()!.document?.id, 'view']">{{ niveaudocumentRef.document?.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/niveaudocument', niveaudocumentRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
