<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (semestre(); as semestreRef) {
      <div>
        <h2 data-cy="semestreDetailsHeading"><span jhiTranslate="gestionEcoleApp.semestre.detail.title">Semestre</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ semestreRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="gestionEcoleApp.semestre.libelle">Libelle</span></dt>
          <dd>
            <span>{{ semestreRef.libelle }}</span>
          </dd>
          <dt><span jhiTranslate="gestionEcoleApp.semestre.etat">Etat</span></dt>
          <dd>
            <span>{{ semestreRef.etat }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/semestre', semestreRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
