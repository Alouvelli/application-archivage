<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-employe-heading" jhiTranslate="gestionEcoleApp.employe.home.createOrEditLabel">Create or edit a Employe</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!employe.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="employe.id" readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.employe.telUtilisateur" for="field_telUtilisateur">Tel Utilisateur</label>
                    <input type="text" class="form-control" name="telUtilisateur" id="field_telUtilisateur"
                        [(ngModel)]="employe.telUtilisateur" />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.employe.etatUtilisateur" for="field_etatUtilisateur">Etat Utilisateur</label>
                    <input type="number" class="form-control" name="etatUtilisateur" id="field_etatUtilisateur"
                        [(ngModel)]="employe.etatUtilisateur" />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.employe.user" for="field_user">User</label>
                    <select class="form-control" id="field_user" name="user" [(ngModel)]="employe.user" >
                        <option [ngValue]="null"></option>
                        <option [ngValue]="userOption.id === employe.user?.id ? employe.user : userOption" *ngFor="let userOption of users; trackBy: trackUserById">{{userOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.employe.profil" for="field_profil">Profil</label>
                    <select class="form-control" id="field_profil" name="profil" [(ngModel)]="employe.profil" >
                        <option [ngValue]="null"></option>
                        <option [ngValue]="profilOption.id === employe.profil?.id ? employe.profil : profilOption" *ngFor="let profilOption of profils; trackBy: trackProfilById">{{profilOption.id}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
