<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-rubrique-profil-heading"
        data-cy="RubriqueProfilCreateUpdateHeading"
        jhiTranslate="gestionEcoleApp.rubriqueProfil.home.createOrEditLabel"
      >
        Créer ou éditer un Rubrique Profil
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="gestionEcoleApp.rubriqueProfil.id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_encours" jhiTranslate="gestionEcoleApp.rubriqueProfil.encours">Encours</label>
          <input type="checkbox" class="form-check" name="encours" id="field_encours" data-cy="encours" formControlName="encours" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_profil" jhiTranslate="gestionEcoleApp.rubriqueProfil.profil">Profil</label>
          <select
            class="form-control"
            id="field_profil"
            data-cy="profil"
            name="profil"
            formControlName="profil"
            [compareWith]="compareProfil"
          >
            <option [ngValue]="null"></option>
            @for (profilOption of profilsSharedCollection; track $index) {
              <option [ngValue]="profilOption">{{ profilOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_rubrique" jhiTranslate="gestionEcoleApp.rubriqueProfil.rubrique">Rubrique</label>
          <select
            class="form-control"
            id="field_rubrique"
            data-cy="rubrique"
            name="rubrique"
            formControlName="rubrique"
            [compareWith]="compareRubrique"
          >
            <option [ngValue]="null"></option>
            @for (rubriqueOption of rubriquesSharedCollection; track $index) {
              <option [ngValue]="rubriqueOption">{{ rubriqueOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_profilModule" jhiTranslate="gestionEcoleApp.rubriqueProfil.profilModule"
            >Profil Module</label
          >
          <select
            class="form-control"
            id="field_profilModule"
            data-cy="profilModule"
            name="profilModule"
            formControlName="profilModule"
            [compareWith]="compareProfilModule"
          >
            <option [ngValue]="null"></option>
            @for (profilModuleOption of profilModulesSharedCollection; track $index) {
              <option [ngValue]="profilModuleOption">{{ profilModuleOption.id }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
