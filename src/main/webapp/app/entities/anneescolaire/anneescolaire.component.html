<div>
    <h2 id="page-heading">
        <span jhiTranslate="gestionEcoleApp.anneescolaire.home.title">Anneescolaires</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-anneescolaire" [routerLink]="['/anneescolaire/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="gestionEcoleApp.anneescolaire.home.createLabel">
            Create new Anneescolaire
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="anneescolaires">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="libelle"><span jhiTranslate="gestionEcoleApp.anneescolaire.libelle">Libelle</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="encours"><span jhiTranslate="gestionEcoleApp.anneescolaire.encours">Encours</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="etat"><span jhiTranslate="gestionEcoleApp.anneescolaire.etat">Etat</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let anneescolaire of anneescolaires ;trackBy: trackId">
                <td><a [routerLink]="['/anneescolaire', anneescolaire.id, 'view' ]">{{anneescolaire.id}}</a></td>
                <td>{{anneescolaire.libelle}}</td>
                <td>{{anneescolaire.encours}}</td>
                <td>{{anneescolaire.etat}}</td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                [routerLink]="['/anneescolaire', anneescolaire.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/anneescolaire', anneescolaire.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', 'anneescolaire', { outlets: { popup: anneescolaire.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="anneescolaires && anneescolaires.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
