<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-module-heading" data-cy="ModuleCreateUpdateHeading" jhiTranslate="gestionEcoleApp.module.home.createOrEditLabel">
        Créer ou éditer un Module
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="gestionEcoleApp.module.id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_libelleModule" jhiTranslate="gestionEcoleApp.module.libelleModule">Libelle Module</label>
          <input
            type="text"
            class="form-control"
            name="libelleModule"
            id="field_libelleModule"
            data-cy="libelleModule"
            formControlName="libelleModule"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_logoModule" jhiTranslate="gestionEcoleApp.module.logoModule">Logo Module</label>
          <input
            type="text"
            class="form-control"
            name="logoModule"
            id="field_logoModule"
            data-cy="logoModule"
            formControlName="logoModule"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_etatModule" jhiTranslate="gestionEcoleApp.module.etatModule">Etat Module</label>
          <input
            type="number"
            class="form-control"
            name="etatModule"
            id="field_etatModule"
            data-cy="etatModule"
            formControlName="etatModule"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_rang" jhiTranslate="gestionEcoleApp.module.rang">Rang</label>
          <input type="number" class="form-control" name="rang" id="field_rang" data-cy="rang" formControlName="rang" />
        </div>

        <div class="mb-3">
          <label for="field_sites" jhiTranslate="gestionEcoleApp.module.site">Site</label>
          <select
            class="form-control"
            id="field_sites"
            data-cy="site"
            multiple
            name="sites"
            formControlName="sites"
            [compareWith]="compareSite"
          >
            @for (siteOption of sitesSharedCollection; track $index) {
              <option [ngValue]="siteOption">{{ siteOption.id }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
