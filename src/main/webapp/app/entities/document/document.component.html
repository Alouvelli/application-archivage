<div>
    <h2 id="page-heading">
        <span jhiTranslate="gestionEcoleApp.document.home.title">Documents</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-document" [routerLink]="['/document/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="gestionEcoleApp.document.home.createLabel">
            Create new Document
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="documents">
        <table class="table table-striped">
            <thead>
            <tr jhiSort [(predicate)]="predicate" [(ascending)]="reverse" [callback]="transition.bind(this)">
            <th jhiSortBy="id"><span jhiTranslate="global.field.id">ID</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="etat"><span jhiTranslate="gestionEcoleApp.document.etat">Etat</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="document1"><span jhiTranslate="gestionEcoleApp.document.document1">Document 1</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="document2"><span jhiTranslate="gestionEcoleApp.document.document2">Document 2</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="ref"><span jhiTranslate="gestionEcoleApp.document.ref">Ref</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th jhiSortBy="typeDocument.id"><span jhiTranslate="gestionEcoleApp.document.typeDocument">Type Document</span> <fa-icon [icon]="'sort'"></fa-icon></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let document of documents ;trackBy: trackId">
                <td><a [routerLink]="['/document', document.id, 'view' ]">{{document.id}}</a></td>
                <td>{{document.etat}}</td>
                <td>
                    <a *ngIf="document.document1" (click)="openFile(document.document1ContentType, document.document1)">
                        <img [src]="'data:' + document.document1ContentType + ';base64,' + document.document1" style="max-height: 30px;" alt="document image"/>
                    </a>
                    <span *ngIf="document.document1">{{document.document1ContentType}}, {{byteSize(document.document1)}}</span>
                </td>
                <td>{{document.document2}}</td>
                <td>{{document.ref}}</td>
                <td>
                    <div *ngIf="document.typeDocument">
                        <a [routerLink]="['../type-document', document.typeDocument?.id, 'view' ]" >{{document.typeDocument?.id}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                [routerLink]="['/document', document.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/document', document.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', 'document', { outlets: { popup: document.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="documents && documents.length">
        <div class="row justify-content-center">
            <jhi-item-count [page]="page" [total]="totalItems" [maxSize]="5" [itemsPerPage]="itemsPerPage"></jhi-item-count>
        </div>
        <div class="row justify-content-center">
            <ngb-pagination [collectionSize]="totalItems" [(page)]="page" [pageSize]="itemsPerPage" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" (pageChange)="loadPage(page)"></ngb-pagination>
        </div>
    </div>
</div>
