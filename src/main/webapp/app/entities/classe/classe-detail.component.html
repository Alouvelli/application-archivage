<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="classe">
            <h2><span jhiTranslate="gestionEcoleApp.classe.detail.title">Classe</span> {{classe.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="gestionEcoleApp.classe.description">Description</span></dt>
                <dd>
                    <span>{{classe.description}}</span>
                </dd>
                <dt><span jhiTranslate="gestionEcoleApp.classe.etat">Etat</span></dt>
                <dd>
                    <span>{{classe.etat}}</span>
                </dd>
                <dt><span jhiTranslate="gestionEcoleApp.classe.code">Code</span></dt>
                <dd>
                    <span>{{classe.code}}</span>
                </dd>
                <dt><span jhiTranslate="gestionEcoleApp.classe.libelle">Libelle</span></dt>
                <dd>
                    <span>{{classe.libelle}}</span>
                </dd>
                <dt><span jhiTranslate="gestionEcoleApp.classe.filiere">Filiere</span></dt>
                <dd>
                    <div *ngIf="classe.filiere">
                        <a [routerLink]="['/filiere', classe.filiere?.id, 'view']">{{classe.filiere?.id}}</a>
                    </div>
                </dd>
                <dt><span jhiTranslate="gestionEcoleApp.classe.niveau">Niveau</span></dt>
                <dd>
                    <div *ngIf="classe.niveau">
                        <a [routerLink]="['/niveau', classe.niveau?.id, 'view']">{{classe.niveau?.id}}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/classe', classe.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
