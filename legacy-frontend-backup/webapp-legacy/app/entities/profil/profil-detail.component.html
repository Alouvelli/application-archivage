<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="profil">
            <h2><span jhiTranslate="gestionEcoleApp.profil.detail.title">Profil</span> {{profil.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="gestionEcoleApp.profil.etatProfil">Etat Profil</span></dt>
                <dd>
                    <span>{{profil.etatProfil}}</span>
                </dd>
                <dt><span jhiTranslate="gestionEcoleApp.profil.libelleProfil">Libelle Profil</span></dt>
                <dd>
                    <span>{{profil.libelleProfil}}</span>
                </dd>
                <dt><span jhiTranslate="gestionEcoleApp.profil.ecole">Ecole</span></dt>
                <dd>
                    <div *ngIf="profil.ecole">
                        <a [routerLink]="['/ecole', profil.ecole?.id, 'view']">{{profil.ecole?.id}}</a>
                    </div>
                </dd>
                <dt><span jhiTranslate="gestionEcoleApp.profil.site">Site</span></dt>
                <dd>
                    <div *ngIf="profil.site">
                        <a [routerLink]="['/site', profil.site?.id, 'view']">{{profil.site?.id}}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/profil', profil.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
