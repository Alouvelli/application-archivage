<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="documentexcel">
            <h2><span jhiTranslate="gestionEcoleApp.documentexcel.detail.title">Documentexcel</span> {{documentexcel.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="gestionEcoleApp.documentexcel.excel">Excel</span></dt>
                <dd>
                    <div *ngIf="documentexcel.excel">
                        <a (click)="openFile(documentexcel.excelContentType, documentexcel.excel)" jhiTranslate="entity.action.open">open</a>
                        {{documentexcel.excelContentType}}, {{byteSize(documentexcel.excel)}}
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/documentexcel', documentexcel.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
