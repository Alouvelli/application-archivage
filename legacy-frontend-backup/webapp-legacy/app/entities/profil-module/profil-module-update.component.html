<div class="row justify-content-center">
    <div class="col-8">
        <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-profil-module-heading" jhiTranslate="gestionEcoleApp.profilModule.home.createOrEditLabel">Create or edit a Profil Module</h2>
            <div>
                <jhi-alert-error></jhi-alert-error>
                <div class="form-group" [hidden]="!profilModule.id">
                    <label for="id" jhiTranslate="global.field.id">ID</label>
                    <input type="text" class="form-control" id="id" name="id"
                        [(ngModel)]="profilModule.id" readonly />
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.profilModule.encours" for="field_encours">Encours</label>
                    <input type="checkbox" class="form-control" name="encours" id="field_encours"
                        [(ngModel)]="profilModule.encours" />
                </div>

                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.profilModule.profil" for="field_profil">Profil</label>
                    <select class="form-control" id="field_profil" name="profil" [(ngModel)]="profilModule.profil" >
                        <option [ngValue]="null"></option>
                        <option [ngValue]="profilOption.id === profilModule.profil?.id ? profilModule.profil : profilOption" *ngFor="let profilOption of profils; trackBy: trackProfilById">{{profilOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.profilModule.module" for="field_module">Module</label>
                    <select class="form-control" id="field_module" name="module" [(ngModel)]="profilModule.module" >
                        <option [ngValue]="null"></option>
                        <option [ngValue]="moduleOption.id === profilModule.module?.id ? profilModule.module : moduleOption" *ngFor="let moduleOption of modules; trackBy: trackModuleById">{{moduleOption.id}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="gestionEcoleApp.profilModule.siteProfil" for="field_siteProfil">Site Profil</label>
                    <select class="form-control" id="field_siteProfil" name="siteProfil" [(ngModel)]="profilModule.siteProfil" >
                        <option [ngValue]="null"></option>
                        <option [ngValue]="siteProfilOption.id === profilModule.siteProfil?.id ? profilModule.siteProfil : siteProfilOption" *ngFor="let siteProfilOption of siteprofils; trackBy: trackSiteProfilById">{{siteProfilOption.id}}</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" id="cancel-save" class="btn btn-secondary"  (click)="previousState()">
                    <fa-icon [icon]="'ban'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
                <button type="submit" id="save-entity" [disabled]="editForm.form.invalid || isSaving" class="btn btn-primary">
                    <fa-icon [icon]="'save'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
