<div class="modal-header">
  <h4 class="modal-title">{{ 'entity.delete.title' | translate }}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  <p id="jhi-delete-anneescolaire-heading">
    {{ 'gestionEcoleApp.anneescolaire.delete.question' | translate: { id: anneescolaire?.id } }}
  </p>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
    <fa-icon [icon]="faBan"></fa-icon>
    <span class="ms-2">{{ 'entity.action.cancel' | translate }}</span>
  </button>
  <button id="jhi-confirm-delete-anneescolaire" type="button" class="btn btn-danger" (click)="confirmDelete(anneescolaire?.id)">
    <fa-icon [icon]="faTrash"></fa-icon>
    <span class="ms-2">{{ 'entity.action.delete' | translate }}</span>
  </button>
</div>
